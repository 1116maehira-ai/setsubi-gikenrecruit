<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>設備技研 採用サイト</title>
<meta name="description" content="設備技研 採用サイト">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#0050a7;--blue2:#0077d7;--cyan:#00a7e8;--navy:#003c85;--ink:#10243a;--soft:#f4fbff;--max:1180px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#fff;line-height:1.7}img{max-width:100%;display:block}.wrap{width:min(var(--max),calc(100% - 40px));margin:auto}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#fff;z-index:99;font-weight:900;color:var(--blue)}.loading.is-hidden{display:none}
.hero{position:relative;min-height:900px;overflow:hidden;background:linear-gradient(135deg,#00377d,#0069c7);isolation:isolate}.hero-photo{position:absolute;inset:0;background-position:right top;background-size:87% auto;background-repeat:no-repeat;z-index:0}.hero-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,68,145,.18),rgba(0,68,145,0) 42%);pointer-events:none}.hero-shape{position:absolute;inset:0;background:url("assets/section-01/backgrounds/blue-geometric-shape.png") center/100% 100% no-repeat;z-index:2;pointer-events:none;transform:translate(-1.5%, 4.5%)}.hero-office{position:absolute;right:-1%;top:43.5%;bottom:auto;width:59%;height:50%;background-position:58% 50%;background-size:cover;background-repeat:no-repeat;z-index:1;-webkit-mask:none;mask:none;clip-path:polygon(18% 20%,100% 0,100% 100%,0 100%)}.hero-band{position:absolute;bottom:0;left:0;right:0;height:128px;background:url("assets/section-01/backgrounds/accent-band.png") center/100% 100% no-repeat;z-index:2;pointer-events:none}.hero-content{position:relative;z-index:3;padding:46px 0 190px;color:#fff}.section-no{font-size:16px;letter-spacing:.14em;font-weight:900;color:#1ab7ff;margin-bottom:22px}.eyebrow{display:inline-block;background:linear-gradient(90deg,#0670d0,#074cb0);padding:8px 20px;font-weight:900;font-size:19px;clip-path:polygon(0 0,100% 0,94% 100%,0 100%);margin-bottom:22px}.hero h1{margin:0;width:61%;max-width:none;font-size:clamp(44px,4.75vw,72px);line-height:1.36;font-weight:1000;letter-spacing:.015em}.hero-title-line{display:block}.hero-title-line:nth-child(3){margin-left:-.20em}.hero-title-line:nth-child(4){margin-left:-.75em}.hero-lead{margin-top:28px;width:min(58%,650px);font-size:18px;font-weight:800;line-height:2.05}.hero-points{position:absolute;z-index:4;bottom:42px;left:50%;transform:translateX(-50%);width:min(var(--max),calc(100% - 70px));display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.point{background:#fff;min-height:108px;border-radius:6px;box-shadow:0 12px 30px rgba(0,50,100,.14);display:flex;align-items:center;gap:16px;padding:20px 24px;color:var(--blue)}.point-icon{width:62px;height:62px;flex:0 0 62px;border-radius:50%;background:linear-gradient(135deg,#0877d5,#00489d);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:1000}.point strong{font-size:25px;line-height:1.15;display:block}.point small{display:block;margin-top:8px;font-size:14px;font-weight:800}
.fit{position:relative;padding:56px 0 76px;background:#f4fbff url("assets/section-02/backgrounds/dot-pattern.png") repeat;overflow:hidden}.fit:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,255,255,.9),rgba(255,255,255,.4) 65%,rgba(255,255,255,.1))}.fit .wrap{position:relative}.fit h2{color:var(--blue);font-size:clamp(36px,4.5vw,58px);line-height:1.45;margin:16px 0 44px 64px;font-weight:1000}.fit h2:after{content:"";display:block;width:78px;height:4px;background:var(--blue);margin-top:16px}.fit-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:0 20px}.fit-card{background:#fff;border-radius:16px;min-height:220px;box-shadow:0 14px 35px rgba(0,56,112,.12);padding:22px 14px;text-align:center;display:flex;flex-direction:column;align-items:center}.fit-card img{width:78px;height:78px;object-fit:contain;margin-bottom:8px}.fit-card p{margin:0;color:#111;font-size:16px;font-weight:850;line-height:1.75}.bottom-box{margin:26px 20px 0;background:#fff;border-radius:16px;box-shadow:0 14px 35px rgba(0,56,112,.12);overflow:hidden;display:grid;grid-template-columns:140px 1fr 44%;align-items:center;min-height:130px}.bottom-icon{font-size:64px;text-align:center;color:var(--blue)}.bottom-text{font-size:21px;font-weight:1000;color:var(--blue);padding:20px}.bottom-photo{height:100%;min-height:130px;background-position:center;background-size:cover;position:relative}.bottom-photo:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff,transparent 24%)}
.cms-link{position:fixed;right:14px;bottom:14px;background:#002c67;color:#fff;text-decoration:none;border-radius:999px;padding:10px 15px;font-size:12px;font-weight:900;opacity:.2;transition:.2s;z-index:50}.cms-link:hover{opacity:1}
@media(max-width:900px){.wrap{width:min(100% - 28px,var(--max))}.hero{min-height:auto}.hero-photo{position:relative;inset:auto;height:330px;width:100%;z-index:0;background-position:center top;background-size:cover}.hero-shape{background:linear-gradient(#003477,#005db8);z-index:1}.hero-office,.hero-band{display:none}.hero-content{padding:28px 0 34px}.hero h1,.hero-lead{width:100%}.hero h1{font-size:clamp(38px,11vw,58px);width:100%;white-space:pre-line}.hero-lead{font-size:16px;line-height:1.9}.eyebrow{font-size:15px}.hero-points{position:relative;left:auto;bottom:auto;transform:none;width:100%;grid-template-columns:1fr;padding:0 14px 24px;background:linear-gradient(#005eb9,#008ed8)}.point{min-height:90px}.point strong{font-size:21px}.fit{padding:42px 0 54px}.fit h2{margin:10px 0 30px;font-size:clamp(32px,9vw,46px)}.fit-grid{margin:0;grid-template-columns:1fr 1fr}.fit-card:last-child{grid-column:1/-1}.bottom-box{margin:18px 0 0;grid-template-columns:90px 1fr}.bottom-photo{grid-column:1/-1;min-height:190px}.bottom-text{font-size:17px}.bottom-icon{font-size:48px}}@media(max-width:540px){.fit-grid{grid-template-columns:1fr}.fit-card:last-child{grid-column:auto}}
</style>
</head>
<body>
<div class="loading" id="loading">読み込み中...</div>
<main>
<section class="hero">
<div class="hero-photo" id="heroImage"></div>
<div class="hero-shape"></div>
<div class="hero-office" id="officeImage"></div>
<div class="hero-band"></div>
<div class="wrap hero-content">
<div class="section-no" data-k="section01.section_no">SECTION 01</div>
<div class="eyebrow" data-k="section01.eyebrow">はじめてでも、プロになれる場所がある。</div>
<h1 data-k="section01.title"></h1>
<div class="hero-lead" data-k="section01.lead"></div>
</div>
<div class="hero-points">
<div class="point"><div class="point-icon">人</div><div><strong data-k="section01.point1_title"></strong><small data-k="section01.point1_sub"></small></div></div>
<div class="point"><div class="point-icon">話</div><div><strong data-k="section01.point2_title"></strong><small data-k="section01.point2_sub"></small></div></div>
<div class="point"><div class="point-icon">↑</div><div><strong data-k="section01.point3_title"></strong><small data-k="section01.point3_sub"></small></div></div>
</div>
</section>
<section class="fit">
<div class="wrap">
<div class="section-no" data-k="section02.section_no">SECTION 02</div>
<h2 data-k="section02.title"></h2>
<div class="fit-grid" id="fitGrid"></div>
<div class="bottom-box">
<div class="bottom-icon">♟</div>
<div class="bottom-text" data-k="section02.bottom_text"></div>
<div class="bottom-photo" id="teamImage"></div>
</div>
</div>
</section>
</main>
<a class="cms-link" href="cms.html">CMS</a>
<script>
const SUPABASE_URL="https://pvwktijtqtmvnqofuwro.supabase.co";
const SUPABASE_KEY="sb_publishable_gBV1tZnuBlhjDwoWBrcugA_qd9Fc4cT";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const fallback={
"section01.title":"工具の名前も<br>知らなかった人が、<br>ここでは<br>【できる人】になる。",
"section01.lead":"沖縄で給排水・空調・消火の設備工事を手がける設備技研。<br>経験は問いません。面接は1回。<br>先輩が隣について、少しずつ「できること」を増やしていける、<br>未経験からでも、ちゃんと育つ会社です。"
};
function keyOf(r){return r.section_key+"."+r.field_key}
function setBg(id,url){if(url)document.getElementById(id).style.backgroundImage='url("'+url+'")'}
async function boot(){
 const {data,error}=await sb.from("site_content").select("*").eq("is_active",true).order("section_order").order("sort_order");
 const map={...fallback};
 if(!error) (data||[]).forEach(r=>map[keyOf(r)]=r.value);
 document.querySelectorAll("[data-k]").forEach(el=>{const v=map[el.dataset.k]??"";if(el.dataset.k==="section01.title"){const normalized=String(v).replace(/<br\s*\/?>/gi,"\n");el.innerHTML=normalized.split("\n").map(line=>'<span class="hero-title-line">'+line+'</span>').join("");}else{el.innerHTML=v}});
 setBg("heroImage",map["section01.hero_image"]);
 setBg("officeImage",map["section01.office_image"]);
 setBg("teamImage",map["section02.team_image"]);
 const grid=document.getElementById("fitGrid");
 grid.innerHTML=[1,2,3,4,5].map(i=>'<article class="fit-card"><img src="'+(map["section02.item"+i+"_icon"]||"")+'" alt=""><p>'+(map["section02.item"+i]||"")+'</p></article>').join("");
 document.getElementById("loading").classList.add("is-hidden");
}
boot().catch(()=>document.getElementById("loading").classList.add("is-hidden"));
</script>
</body>
</html>
